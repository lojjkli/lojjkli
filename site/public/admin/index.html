<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <title>Admin · lojjkli</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --void: #020202;
      --card: #111;
      --line: #262626;
      --line-bright: #3c3c3c;
      --text: #f2f2f2;
      --dim: #a3a3a3;
      --faint: #6c6c6c;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;

      --display: "Space Grotesk", sans-serif;
      --body: "Inter", sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--void);
      color: var(--text);
      font: 15px/1.6 var(--body);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    h1 {
      font: 600 26px/1.1 var(--display);
      margin: 0 0 4px;
    }

    .sub {
      color: var(--faint);
      font-size: 13px;
      margin: 0 0 28px;
    }

    h2 {
      font: 600 15px var(--display);
      margin: 0 0 14px;
      color: var(--dim);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: var(--faint);
      font: 500 11px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font: 14px var(--mono);
      outline: none;
    }

    input:focus {
      border-color: var(--line-bright);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    button {
      background: var(--text);
      border: 0;
      border-radius: 8px;
      color: var(--void);
      padding: 9px 16px;
      font: 600 13px var(--body);
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button.danger {
      background: var(--red);
      color: white;
    }

    button.warn {
      background: var(--amber);
      color: #1a1204;
    }

    button.ghost {
      background: transparent;
      color: var(--dim);
      border: 1px solid var(--line-bright);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }

    td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      font: 13px var(--mono);
      vertical-align: middle;
    }

    td.who {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 500;
      border-bottom: none;
    }

    td.reason,
    td.time {
      color: var(--dim);
    }

    td.btns {
      text-align: right;
      width: 1%;
      white-space: nowrap;
    }

    td.btns button {
      margin-left: 6px;
    }

    tr {
      border-bottom: 1px solid var(--line);
    }

    .head {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      image-rendering: pixelated;
      background: #0a0a0a;
      border: 1px solid var(--line);
      flex: none;
    }

    #msg {
      font: 13px var(--mono);
      color: var(--dim);
      min-height: 18px;
      margin-top: 10px;
    }

    .error {
      color: var(--red) !important;
    }

    .success {
      color: var(--green) !important;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 2px;
      box-shadow: 0 0 6px var(--green);
      flex: none;
    }

    @media (max-width: 600px) {
      .row {
        flex-direction: column;
      }

      .row > div {
        width: 100%;
      }

      .row > div:last-child {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>KlisTeamMod admin</h1>
  <p class="sub">
    Server blacklist, player bans, and who is currently using the mod.
  </p>

  <!-- LOGIN -->
  <div class="card" id="loginCard">

    <label for="key">Admin key</label>

    <div class="row">
      <div>
        <input
          id="key"
          type="password"
          placeholder="Enter admin key"
          autocomplete="current-password"
        >
      </div>

      <div style="flex: 0 0 auto">
        <button id="unlockBtn" onclick="unlock()">
          Unlock
        </button>
      </div>
    </div>

    <div id="msg"></div>

  </div>

  <!-- ADMIN PANELS -->
  <div id="panels" style="display:none">

    <!-- BLOCKED SERVERS -->
    <div class="card">

      <h2>Blocked servers</h2>

      <div class="row">

        <div>
          <input id="server" placeholder="play.example.com">
        </div>

        <div>
          <input id="serverReason" placeholder="Reason (optional)">
        </div>

        <div style="flex:0 0 auto">
          <button onclick="addServer()">Block</button>
        </div>

      </div>

      <table id="serverList">
        <tbody></tbody>
      </table>

    </div>

    <!-- BANNED PLAYERS -->
    <div class="card">

      <h2>Banned players</h2>

      <div class="row">

        <div>
          <input id="player" placeholder="Username">
        </div>

        <div>
          <input id="playerReason" placeholder="Reason (optional)">
        </div>

        <div style="flex:0 0 auto">
          <button class="danger" onclick="addPlayer()">Ban</button>
        </div>

      </div>

      <table id="playerList">
        <tbody></tbody>
      </table>

    </div>

    <!-- ONLINE -->
    <div class="card">

      <h2>
        Using the mod right now
        <span style="color:var(--faint);font-weight:400">
          (last 5 min)
        </span>
      </h2>

      <table id="onlineList">
        <tbody></tbody>
      </table>

    </div>

  </div>
</div>

<script>
  const API = "https://api.lojjkli.site";

  const $ = id => document.getElementById(id);

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function safeName(value) {
    return String(value ?? "").replace(/[^A-Za-z0-9_]/g, "");
  }

  function setMessage(text, type = "") {
    const msg = $("msg");

    msg.textContent = text;
    msg.className = type;
  }

  function head(name) {
    const safe = safeName(name);

    return `
      <img
        class="head"
        alt=""
        loading="lazy"
        src="https://mc-heads.net/avatar/${safe}/24"
        onerror="
          this.onerror=null;
          this.src='https://crafatar.com/avatars/${safe}?size=24&overlay'
        "
      >
    `;
  }

  async function apiRequest(url, options = {}) {
    try {
      return await fetch(url, {
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.headers || {})
        }
      });
    } catch (error) {
      console.error("API request failed:", error);
      throw error;
    }
  }

  async function unlock() {
    const key = $("key").value.trim();
    const button = $("unlockBtn");

    if (!key) {
      setMessage("Enter the admin key.", "error");
      $("key").focus();
      return;
    }

    button.disabled = true;
    setMessage("Checking...");

    try {
      const response = await apiRequest(`${API}/verify`, {
        method: "GET",
        headers: {
          "x-admin-key": key
        }
      });

      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          setMessage("Wrong admin key.", "error");
        } else {
          setMessage(
            `Server returned HTTP ${response.status}.`,
            "error"
          );
        }

        button.disabled = false;
        return;
      }

      setMessage("Unlocked.", "success");

      $("loginCard").style.display = "none";
      $("panels").style.display = "block";

      await refreshBlacklist();
      await refreshOnline();

      setInterval(refreshOnline, 15000);

    } catch (error) {
      console.error(error);

      setMessage(
        "Could not connect to the API. Check CORS and the API URL.",
        "error"
      );

      button.disabled = false;
    }
  }

  async function refreshBlacklist() {
    try {
      const response = await apiRequest(`${API}/blacklist`);

      if (!response.ok) {
        throw new Error(`Blacklist HTTP ${response.status}`);
      }

      const data = await response.json();

      const details = Array.isArray(data.detail)
        ? data.detail
        : [];

      // SERVERS
      $("serverList").querySelector("tbody").innerHTML =
        details
          .filter(x => x.kind === "server")
          .map(row => `
            <tr>
              <td>${escapeHtml(row.value)}</td>
              <td class="reason">${escapeHtml(row.reason)}</td>
              <td class="btns">
                <button
                  class="ghost"
                  onclick="removeItem('server', ${JSON.stringify(row.value)})"
                >
                  Remove
                </button>
              </td>
            </tr>
          `)
          .join("") ||
        `<tr>
          <td class="reason">No servers blocked</td>
        </tr>`;

      // PLAYERS
      $("playerList").querySelector("tbody").innerHTML =
        details
          .filter(x => x.kind === "player")
          .map(row => `
            <tr>
              <td class="who">
                ${head(row.display)}
                ${escapeHtml(row.display)}
              </td>

              <td class="reason">
                ${escapeHtml(row.reason)}
              </td>

              <td class="btns">

                <button
                  class="warn"
                  onclick="kick(${JSON.stringify(row.display)})"
                >
                  Kick
                </button>

                <button
                  class="ghost"
                  onclick="removeItem('player', ${JSON.stringify(row.value)})"
                >
                  Unban
                </button>

              </td>
            </tr>
          `)
          .join("") ||
        `<tr>
          <td class="reason">Nobody banned</td>
        </tr>`;

    } catch (error) {
      console.error("Blacklist error:", error);
    }
  }

  async function refreshOnline() {
    try {
      const response = await apiRequest(`${API}/online?minutes=5`);

      if (!response.ok) {
        throw new Error(`Online HTTP ${response.status}`);
      }

      const data = await response.json();

      const players = Array.isArray(data.players)
        ? data.players
        : [];

      $("onlineList").querySelector("tbody").innerHTML =
        players
          .map(player => {

            const secondsAgo = Math.max(
              0,
              Math.round((Date.now() - player.last) / 1000)
            );

            return `
              <tr>

                <td class="who">
                  <span class="dot"></span>
                  ${head(player.name)}
                  ${escapeHtml(player.name)}
                </td>

                <td class="time">
                  ${secondsAgo}s ago
                </td>

                <td class="btns">

                  <button
                    class="warn"
                    onclick="kick(${JSON.stringify(player.name)})"
                  >
                    Kick
                  </button>

                  <button
                    class="danger"
                    onclick="banFromOnline(${JSON.stringify(player.name)})"
                  >
                    Ban
                  </button>

                </td>

              </tr>
            `;
          })
          .join("") ||
        `<tr>
          <td class="reason">
            Nobody currently active
          </td>
        </tr>`;

    } catch (error) {
      console.error("Online error:", error);
    }
  }

  async function write(kind, value, reason, method) {

    const key = $("key").value.trim();

    if (!key) {
      setMessage("Enter the admin key first.", "error");
      return false;
    }

    if (!value) {
      setMessage("Nothing entered.", "error");
      return false;
    }

    const params = new URLSearchParams();

    params.set("kind", kind);
    params.set("value", value);

    if (reason) {
      params.set("reason", reason);
    }

    try {

      const response = await apiRequest(
        `${API}/blacklist?${params.toString()}`,
        {
          method,
          headers: {
            "x-admin-key": key
          }
        }
      );

      if (!response.ok) {
        setMessage(
          `Failed: HTTP ${response.status}`,
          "error"
        );

        return false;
      }

      setMessage("Saved.", "success");
      return true;

    } catch (error) {

      console.error(error);

      setMessage(
        "Could not reach the API.",
        "error"
      );

      return false;
    }
  }

  async function addServer() {

    const value = $("server").value.trim().toLowerCase();
    const reason = $("serverReason").value.trim();

    const success = await write(
      "server",
      value,
      reason,
      "POST"
    );

    if (success) {
      $("server").value = "";
      $("serverReason").value = "";

      await refreshBlacklist();
    }
  }

  async function addPlayer() {

    const value = $("player").value.trim();
    const reason = $("playerReason").value.trim();

    const success = await write(
      "player",
      value,
      reason,
      "POST"
    );

    if (success) {
      $("player").value = "";
      $("playerReason").value = "";

      await refreshBlacklist();
    }
  }

  async function banFromOnline(name) {

    const success = await write(
      "player",
      name,
      "banned from online list",
      "POST"
    );

    if (success) {
      await refreshBlacklist();
      await refreshOnline();
    }
  }

  async function removeItem(kind, value) {

    const success = await write(
      kind,
      value,
      "",
      "DELETE"
    );

    if (success) {
      await refreshBlacklist();
    }
  }

  async function kick(name) {

    const key = $("key").value.trim();

    if (!key) {
      setMessage("Enter the admin key first.", "error");
      return;
    }

    try {

      const response = await apiRequest(
        `${API}/kick?name=${encodeURIComponent(name)}`,
        {
          method: "POST",
          headers: {
            "x-admin-key": key
          }
        }
      );

      if (response.ok) {
        setMessage(
          `Kick sent for ${name}.`,
          "success"
        );
      } else {
        setMessage(
          `Kick failed: HTTP ${response.status}`,
          "error"
        );
      }

    } catch (error) {

      console.error(error);

      setMessage(
        "Could not reach the API.",
        "error"
      );
    }
  }

  // ENTER KEY = UNLOCK
  $("key").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      unlock();
    }
  });
</script>

</body>
</html>
