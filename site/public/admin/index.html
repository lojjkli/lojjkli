<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<title>lojjkli · Welcome back, Kli</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #020202;
    --black: #050505;
    --card: #0d0d0d;
    --card-hover: #111111;
    --line: #1f1f1f;
    --line-bright: #333333;

    --text: #f4f4f4;
    --dim: #9a9a9a;
    --faint: #5e5e5e;

    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;

    --display: "Space Grotesk", sans-serif;
    --body: "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; }

  html { background: var(--void); scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,.055), transparent 34%),
      var(--void);
    color: var(--text);
    font: 15px/1.6 var(--body);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: .25;
    background:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
  }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #111 0%, #050505 42%, #020202 75%);
    opacity: 1;
    cursor: pointer;
    transition: opacity .6s cubic-bezier(.77,0,.18,1), visibility .6s;
  }

  #intro::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 4px);
    opacity: .3;
    pointer-events: none;
  }

  #intro::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.75) 100%);
    pointer-events: none;
  }

  .intro-content {
    position: relative;
    z-index: 2;
    width: min(90vw, 700px);
    text-align: center;
    animation: introEnter 1.6s cubic-bezier(.2,.8,.2,1) both;
  }

  .intro-overline {
    margin-bottom: 14px;
    color: #666;
    font: 500 10px var(--mono);
    letter-spacing: .34em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .8s ease .35s forwards;
  }

  /* Decorative only - the real page heading is .brand-name below, so this
     is not a second <h1>: screen readers should skip straight past it.
     One glowing sweep crosses the static text once, rather than animating
     each letter separately - a single deliberate moment instead of a
     16-node stagger that has to be kept in sync by hand. */
  .intro-title {
    margin: 0;
    font: 700 clamp(34px, 7.5vw, 76px)/1.05 var(--display);
    letter-spacing: -.04em;
    white-space: nowrap;
    background: linear-gradient(100deg, #444 0%, #444 42%, #ffffff 50%, #444 58%, #444 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: fadeUp .7s ease .4s forwards, introSweep 1.7s cubic-bezier(.2,.8,.2,1) .45s forwards;
  }

  .intro-line {
    width: 0;
    height: 1px;
    margin: 22px auto 16px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
    animation: lineGrow 1s ease .8s forwards;
  }

  .intro-sub {
    color: #696969;
    font: 500 10px var(--mono);
    letter-spacing: .3em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .8s ease 1.1s forwards;
  }

  .intro-status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 56px;
    text-align: center;
    color: #555;
    font: 500 10px var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .8s ease 1.3s forwards;
  }

  .intro-dot {
    display: inline-block;
    vertical-align: middle;
    margin-right: 9px;
    margin-bottom: 1px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,.55);
    animation: pulse 1.3s ease-in-out infinite;
  }

  .intro-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 32px;
    width: min(260px, 60vw);
    height: 1px;
    margin: 0 auto;
    background: #171717;
    overflow: hidden;
  }

  .intro-progress-bar {
    width: 40%;
    height: 100%;
    background: #aaa;
    animation: scan 1.8s ease-in-out infinite;
  }

  .intro-skip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 16px;
    text-align: center;
    color: #3a3a3a;
    font: 500 9px var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .8s ease 1.6s forwards;
  }

  #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .wrap {
    position: relative;
    z-index: 1;
    width: min(100%, 760px);
    margin: 0 auto;
    padding: 64px 24px 100px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 34px;
  }

  .brand-name { margin: 0; font: 700 30px/1 var(--display); letter-spacing: -.045em; }

  .brand-sub {
    margin: 8px 0 0;
    color: var(--faint);
    font: 500 10px var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .brand-actions { display: flex; align-items: center; gap: 8px; flex: none; }

  .iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    color: var(--faint);
    border: 1px solid var(--line-bright);
    border-radius: var(--r-sm);
    font: 500 11px var(--mono);
    padding: 8px 10px;
    line-height: 1;
  }
  .iconbtn svg { width: 14px; height: 14px; display: block; }
  .iconbtn:hover { color: #ddd; background: #171717; }

  #lockBtn { display: none; }

  h2 { margin: 0 0 14px; color: #c7c7c7; font: 600 14px var(--display); }
  h2 .h2-icon { width: 15px; height: 15px; margin-right: 8px; vertical-align: -3px; color: var(--faint); }

  .card {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.025), rgba(255,255,255,.008)), var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.18);
    transition: border-color .2s ease, background .2s ease;
  }
  .card:hover { border-color: #2b2b2b; }
  .card.flash { animation: cardFlash 1s ease; }

  label {
    display: block;
    margin-bottom: 9px;
    color: var(--faint);
    font: 500 10px var(--mono);
    letter-spacing: .13em;
    text-transform: uppercase;
  }

  input {
    width: 100%;
    padding: 11px 13px;
    background: #080808;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    outline: none;
    font: 14px var(--mono);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder { color: #454545; }
  input:focus { border-color: #404040; background: #0a0a0a; box-shadow: 0 0 0 3px rgba(255,255,255,.025); }

  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }

  button {
    position: relative;
    background: #f1f1f1;
    border: 1px solid #f1f1f1;
    border-radius: var(--r-sm);
    color: #050505;
    padding: 10px 17px;
    font: 600 12px var(--body);
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s ease, opacity .15s ease, background .15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(.98); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  button.danger { color: #fff; background: var(--red); border-color: var(--red); }
  button.warn { color: #1a1204; background: var(--amber); border-color: var(--amber); }
  button.ghost { color: #a0a0a0; background: transparent; border-color: var(--line-bright); }
  button.ghost:hover { background: #171717; color: #ddd; }

  #msg { min-height: 18px; margin-top: 11px; font: 500 11px var(--mono); color: var(--dim); }
  #msg.error { color: var(--red); }
  #msg.success { color: var(--green); }

  table { width: 100%; border-collapse: collapse; margin-top: 5px; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); color: #ddd; font: 13px var(--mono); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.reason, td.time { color: var(--dim); }
  td.btns { width: 1%; text-align: right; white-space: nowrap; }
  td.btns button { margin-left: 5px; }

  /* .who is a span *inside* a <td>, not the cell itself - a <td> switched
     to display:flex stops behaving like a table cell and can size itself
     out of step with its neighbours, which is what was throwing the text
     in this row out of line with the others. */
  .who { display: inline-flex; align-items: center; gap: 9px; font-weight: 500; }
  .who .name { line-height: 1; }

  .head {
    width: 24px; height: 24px; flex: none; border-radius: var(--r-sm);
    background: #080808; border: 1px solid var(--line); image-rendering: pixelated;
  }

  .dot {
    width: 7px; height: 7px; flex: none; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,.75);
    animation: onlinePulse 1.8s ease-in-out infinite;
  }

  .empty { color: var(--faint); }

  /* Relay state and version for each active player. "relay" means that client
     reported an open room connection on its last check-in, not merely that the
     mod is loaded. */
  .tag {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid var(--line-bright);
    border-radius: 999px;
    color: var(--faint);
    font: 500 10px var(--mono);
    letter-spacing: .06em;
  }
  .tag.on { color: var(--green); border-color: rgba(34,197,94,.45); }
  td.ver { color: var(--dim); font-size: 12px; }

  /* Kli, watching from the corner. A plain <img src="...gif"> plays on its
     own - no JS, no canvas, nothing to keep running - so this costs one
     cached image request and nothing at runtime. Hidden once the viewport
     is too narrow to have room beside the panel. */
  .mascot {
    position: fixed;
    right: 26px;
    bottom: 26px;
    width: 108px;
    height: 108px;
    z-index: 5;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 20px rgba(255,255,255,.10));
    pointer-events: none;
    opacity: .92;
  }
  @media (max-width: 980px) { .mascot { display: none; } }

  .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .refresh-row h2 { margin: 0; }
  #onlineRefreshed { color: var(--faint); font: 500 10px var(--mono); }

  @keyframes introEnter { from { opacity: 0; transform: scale(.97); filter: blur(8px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
  @keyframes introSweep { from { background-position: 140% 0; } to { background-position: -40% 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes lineGrow { to { width: min(260px, 60vw); } }
  @keyframes scan { 0% { transform: translateX(-120%); } 100% { transform: translateX(350%); } }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes onlinePulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @keyframes cardFlash { 0% { border-color: rgba(255,255,255,.4); box-shadow: 0 0 0 3px rgba(255,255,255,.06), 0 18px 60px rgba(0,0,0,.18); } 100% { border-color: var(--line); box-shadow: 0 18px 60px rgba(0,0,0,.18); } }

  @media (max-width: 640px) {
    .wrap { padding: 38px 15px 70px; }
    .row { flex-direction: column; }
    .row > div { width: 100%; }
    .row button { width: 100%; }
    .intro-title { white-space: normal; padding: 0 15px; }
    table, tbody, tr, td { width: 100%; }
    td.btns { text-align: right; }
    td.reason { display: none; }
    td.ver { display: none; }
    td.time { font-size: 11px; }
    td.btns button { padding: 8px 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .intro-title { background-position: -40% 0; opacity: 1; }
  }
</style>
</head>

<body>

<div id="intro" role="button" tabindex="0" aria-label="Skip intro">
  <div class="intro-content" aria-hidden="true">
    <div class="intro-overline">KlisTeam Studio</div>
    <div class="intro-title">Welcome back, Kli</div>
    <div class="intro-line"></div>
    <div class="intro-sub">lojjkli · private administration</div>
  </div>
  <div class="intro-status" aria-hidden="true">
    <span class="intro-dot"></span>
    Secure session initializing
  </div>
  <div class="intro-progress" aria-hidden="true"><div class="intro-progress-bar"></div></div>
  <div class="intro-skip" aria-hidden="true">click or press any key to skip</div>
</div>

<img class="mascot" src="kli_looking.gif" alt="" aria-hidden="true">

<div class="wrap">

  <div class="brand">
    <div>
      <h1 class="brand-name">lojjkli</h1>
      <p class="brand-sub">KlisTeam Studio · Administration</p>
    </div>
    <div class="brand-actions">
      <button id="lockBtn" class="iconbtn" onclick="lock()">Lock</button>
    </div>
  </div>

  <div class="card" id="loginCard">
    <label for="key">Admin key</label>
    <div class="row">
      <div>
        <input id="key" type="password" placeholder="Enter admin key" autocomplete="current-password" spellcheck="false">
      </div>
      <div style="flex:0 0 auto">
        <button id="unlockBtn" onclick="unlock()">Unlock</button>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>

  <div id="panels" style="display:none">

    <div class="card">
      <h2>
        <svg class="h2-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="14" width="16" height="5" rx="1.5"/>
          <line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/>
          <line x1="3" y1="21" x2="21" y2="3"/>
        </svg>Blocked servers
      </h2>
      <div class="row">
        <div><input id="server" placeholder="play.example.com"></div>
        <div><input id="serverReason" placeholder="Reason (optional)"></div>
        <div style="flex:0 0 auto"><button id="blockBtn" onclick="addServer()">Block</button></div>
      </div>
      <table id="serverList"><tbody></tbody></table>
    </div>

    <div class="card">
      <h2>
        <svg class="h2-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>
          <line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
        </svg>Banned players
      </h2>
      <div class="row">
        <div><input id="player" placeholder="Username"></div>
        <div><input id="playerReason" placeholder="Reason (optional)"></div>
        <div style="flex:0 0 auto"><button id="banBtn" class="danger" onclick="addPlayer()">Ban</button></div>
      </div>
      <table id="playerList"><tbody></tbody></table>
    </div>

    <div class="card">
      <div class="refresh-row">
        <h2>
          <svg class="h2-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h4l2-7 4 14 2-7h6"/>
          </svg>Using the mod right now <span style="color:var(--faint);font-weight:400">(last 5 min)</span>
        </h2>
        <span id="onlineRefreshed"></span>
      </div>
      <table id="onlineList"><tbody></tbody></table>
    </div>

  </div>

</div>

<script>
const API = "https://api.lojjkli.site";
const REQUEST_TIMEOUT_MS = 10000;

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeName(value) {
  return String(value ?? "").replace(/[^A-Za-z0-9_]/g, "");
}

function setMessage(text, type = "") {
  const msg = $("msg");
  msg.textContent = text;
  msg.className = type;
  if (type === "error") playErrorSound();
  else if (type === "success") playSuccessSound();
}

function head(name) {
  const safe = safeName(name);
  return `<img class="head" alt="" loading="lazy" src="https://mc-heads.net/avatar/${safe}/24" onerror="this.onerror=null;this.src='https://crafatar.com/avatars/${safe}?size=24&overlay'">`;
}

/* ---------- sound ---------- */
/* Every sound is a couple of synthesised oscillator tones - no audio
   files, nothing to download, nothing kept running once it has played.
   A single AudioContext is created lazily on first use. */

let audioContext = null;

function getAudioContext() {
  if (audioContext) return audioContext;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  audioContext = new AudioCtx();
  return audioContext;
}

function primeAudio() {
  const ctx = getAudioContext();
  if (!ctx) return null;
  if (ctx.state === "suspended") ctx.resume().catch(() => {});
  return ctx;
}

function envTone(ctx, { type = "sine", freq, freqTo, start = 0, dur = .12, peak = .04, attack = .008 }) {
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqTo) osc.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
  gain.gain.setValueAtTime(.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + .03);
}

function playStartupSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "sine", freq: 105, freqTo: 42, dur: .85, peak: .25, attack: .02 });
  envTone(ctx, { type: "triangle", freq: 720, freqTo: 1500, start: .15, dur: .85, peak: .045, attack: .1 });
}

function playClickSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "sine", freq: 620, freqTo: 390, dur: .07, peak: .035, attack: .006 });
}

function playSuccessSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "sine", freq: 520, dur: .09, peak: .05, attack: .006 });
  envTone(ctx, { type: "sine", freq: 784, start: .07, dur: .16, peak: .045, attack: .006 });
}

function playErrorSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "square", freq: 180, freqTo: 140, dur: .09, peak: .03, attack: .004 });
  envTone(ctx, { type: "square", freq: 150, freqTo: 105, start: .11, dur: .12, peak: .03, attack: .004 });
}

function playKickSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "sawtooth", freq: 900, freqTo: 120, dur: .16, peak: .035, attack: .004 });
}

function playBanSound() {
  const ctx = primeAudio();
  if (!ctx) return;
  envTone(ctx, { type: "sine", freq: 220, freqTo: 55, dur: .38, peak: .07, attack: .01 });
  envTone(ctx, { type: "square", freq: 80, start: .02, dur: .16, peak: .03, attack: .004 });
}

/* ---------- intro ---------- */

let introFinished = false;

function finishIntro() {
  if (introFinished) return;
  introFinished = true;
  const intro = $("intro");
  if (!intro) return;
  intro.classList.add("hide");
  setTimeout(() => intro.remove(), 700);
}

function activateAudio() {
  playStartupSound();
}

// A click or key press is the only thing that dismisses this screen - it
// stays up until someone actually acts on it, no auto-timeout.
$("intro").addEventListener("click", () => { activateAudio(); finishIntro(); });
$("intro").addEventListener("keydown", () => { activateAudio(); finishIntro(); });

/* ---------- api ---------- */

async function apiRequest(url, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    return await fetch(url, {
      ...options,
      signal: controller.signal,
      headers: { "Accept": "application/json", ...(options.headers || {}) }
    });
  } catch (error) {
    // A hung request used to leave a button disabled with no feedback
    // forever; the timeout above guarantees this always resolves into a
    // real error instead of a silent, indefinite wait.
    if (error.name === "AbortError") throw new Error("Request timed out - the API may be unreachable.");
    console.error("API request failed:", error);
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

async function unlock() {
  playClickSound();
  const key = $("key").value.trim();
  const button = $("unlockBtn");

  if (!key) { setMessage("Enter the admin key.", "error"); $("key").focus(); return; }

  button.disabled = true;
  setMessage("Checking...");

  try {
    const response = await apiRequest(`${API}/verify`, { method: "GET", headers: { "x-admin-key": key } });

    if (!response.ok) {
      setMessage(response.status === 401 || response.status === 403 ? "Wrong admin key." : `Server returned HTTP ${response.status}.`, "error");
      button.disabled = false;
      return;
    }

    setMessage("Unlocked.", "success");
    $("loginCard").style.display = "none";
    $("panels").style.display = "block";
    $("lockBtn").style.display = "inline-flex";

    await refreshBlacklist();
    await refreshOnline();

    if (!window.onlineTimer) window.onlineTimer = setInterval(refreshOnline, 15000);

  } catch (error) {
    console.error(error);
    setMessage(error.message || "Could not connect to the API.", "error");
    button.disabled = false;
  }
}

// There was no way back to a locked state short of reloading the page - for
// a tool that bans and kicks people, being able to step away without
// leaving it sitting open is worth a one-click button.
function lock() {
  playClickSound();
  $("key").value = "";
  $("loginCard").style.display = "block";
  $("panels").style.display = "none";
  $("lockBtn").style.display = "none";
  setMessage("");
  if (window.onlineTimer) { clearInterval(window.onlineTimer); window.onlineTimer = null; }
}

async function refreshBlacklist() {
  try {
    // /blacklist is a public read - the mod itself calls it with no key at
    // all. Sending the admin key here too was unnecessary: it exposed the
    // key on every poll instead of only on the writes that actually need
    // it, and forced a CORS preflight on a call that never required one.
    const response = await apiRequest(`${API}/blacklist`, { method: "GET" });
    if (!response.ok) throw new Error(`Blacklist HTTP ${response.status}`);

    const data = await response.json();
    const details = Array.isArray(data.detail) ? data.detail : [];

    $("serverList").querySelector("tbody").innerHTML = details
      .filter(x => x.kind === "server")
      .map(row => `<tr><td>${escapeHtml(row.value)}</td><td class="reason">${escapeHtml(row.reason)}</td><td class="btns"><button class="ghost" data-action="remove" data-kind="server" data-value="${escapeHtml(row.value)}">Remove</button></td></tr>`)
      .join("") || `<tr><td class="empty" colspan="3">No servers blocked</td></tr>`;

    $("playerList").querySelector("tbody").innerHTML = details
      .filter(x => x.kind === "player")
      .map(row => `<tr><td><span class="who">${head(row.display)}<span class="name">${escapeHtml(row.display)}</span></span></td><td class="reason">${escapeHtml(row.reason)}</td><td class="btns"><button class="warn" data-action="kick" data-name="${escapeHtml(row.display)}">Kick</button><button class="ghost" data-action="remove" data-kind="player" data-value="${escapeHtml(row.value)}">Unban</button></td></tr>`)
      .join("") || `<tr><td class="empty" colspan="3">Nobody banned</td></tr>`;

  } catch (error) {
    console.error("Blacklist error:", error);
    setMessage(error.message || "Could not load blacklist.", "error");
  }
}

async function refreshOnline() {
  try {
    const response = await apiRequest(`${API}/online?minutes=5`);
    if (!response.ok) throw new Error(`Online HTTP ${response.status}`);

    const data = await response.json();
    const players = Array.isArray(data.players) ? data.players : [];

    $("onlineList").querySelector("tbody").innerHTML = players
      .map(player => {
        const secondsAgo = Math.max(0, Math.round((Date.now() - player.last) / 1000));
        const relay = player.relay
          ? `<span class="tag on">relay</span>`
          : `<span class="tag">idle</span>`;
        const version = escapeHtml(player.version || "?");
        return `<tr><td><span class="who"><span class="dot"></span>${head(player.name)}<span class="name">${escapeHtml(player.name)}</span></span></td><td>${relay}</td><td class="ver">${version}</td><td class="time">${secondsAgo}s ago</td><td class="btns"><button class="warn" data-action="kick" data-name="${escapeHtml(player.name)}">Kick</button><button class="danger" data-action="ban" data-name="${escapeHtml(player.name)}">Ban</button></td></tr>`;
      }).join("") || `<tr><td class="empty" colspan="5">Nobody currently active</td></tr>`;

    $("onlineRefreshed").textContent = "updated just now";

  } catch (error) {
    console.error("Online error:", error);
    $("onlineRefreshed").textContent = "refresh failed";
  }
}

async function write(kind, value, reason, method) {
  const key = $("key").value.trim();

  if (!key) { setMessage("Enter the admin key first.", "error"); return false; }
  if (!value) { setMessage("Nothing entered.", "error"); return false; }

  const params = new URLSearchParams();
  params.set("kind", kind);
  params.set("value", value);
  if (reason) params.set("reason", reason);

  try {
    const response = await apiRequest(`${API}/blacklist?${params.toString()}`, { method, headers: { "x-admin-key": key } });

    if (!response.ok) {
      let errorText = "";
      try { errorText = await response.text(); } catch (_) {}
      console.error("Write failed:", response.status, errorText);
      setMessage(`Failed: HTTP ${response.status}`, "error");
      return false;
    }

    setMessage(method === "DELETE" ? "Removed." : "Saved.", "success");
    return true;

  } catch (error) {
    console.error(error);
    setMessage(error.message || "Could not reach the API.", "error");
    return false;
  }
}

async function addServer() {
  playClickSound();
  const button = $("blockBtn");
  button.disabled = true;
  try {
    const value = $("server").value.trim().toLowerCase();
    const reason = $("serverReason").value.trim();
    if (await write("server", value, reason, "POST")) {
      $("server").value = "";
      $("serverReason").value = "";
      await refreshBlacklist();
    }
  } finally {
    button.disabled = false;
  }
}

async function addPlayer() {
  playClickSound();
  const button = $("banBtn");
  button.disabled = true;
  try {
    const value = $("player").value.trim();
    const reason = $("playerReason").value.trim();
    if (await write("player", value, reason, "POST")) {
      $("player").value = "";
      $("playerReason").value = "";
      await refreshBlacklist();
    }
  } finally {
    button.disabled = false;
  }
}

async function banFromOnline(name) {
  if (await write("player", name, "banned from online list", "POST")) {
    await refreshBlacklist();
    await refreshOnline();
  }
}

async function removeItem(kind, value) {
  if (await write(kind, value, "", "DELETE")) await refreshBlacklist();
}

async function kick(name) {
  const key = $("key").value.trim();
  if (!key) { setMessage("Enter the admin key first.", "error"); return; }

  try {
    const response = await apiRequest(`${API}/kick?name=${encodeURIComponent(name)}`, { method: "POST", headers: { "x-admin-key": key } });

    if (response.ok) {
      setMessage(`Kick sent for ${name}.`, "success");
      await refreshOnline();
    } else {
      let errorText = "";
      try { errorText = await response.text(); } catch (_) {}
      console.error("Kick failed:", response.status, errorText);
      setMessage(`Kick failed: HTTP ${response.status}`, "error");
    }
  } catch (error) {
    console.error(error);
    setMessage(error.message || "Could not reach the API.", "error");
  }
}

$("key").addEventListener("keydown", event => {
  if (event.key === "Enter") { event.preventDefault(); unlock(); }
});

// Ban is the one action here with real, slow-to-undo consequences for
// someone else, and it used to fire on a single accidental click straight
// from the online list. It now needs the same button pressed twice within
// a few seconds; every other action (kick, remove/unban, block) stays a
// single click, since a kick just disconnects them and the rest are
// trivially reversible.
const pendingConfirm = new WeakMap();

document.addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button) return;

  const action = button.dataset.action;
  if (!action) return;

  if (action === "ban") {
    const now = Date.now();
    const armed = pendingConfirm.get(button);
    if (!armed || now - armed > 4000) {
      pendingConfirm.set(button, now);
      const original = button.textContent;
      button.textContent = "Confirm?";
      playClickSound();
      setTimeout(() => { if (button.textContent === "Confirm?") button.textContent = original; }, 4000);
      return;
    }
    pendingConfirm.delete(button);
    button.textContent = "Ban";
    playBanSound();
  } else if (action === "kick") {
    playKickSound();
  } else {
    playClickSound();
  }

  button.disabled = true;
  try {
    if (action === "remove") await removeItem(button.dataset.kind, button.dataset.value);
    else if (action === "kick") await kick(button.dataset.name);
    else if (action === "ban") await banFromOnline(button.dataset.name);
  } finally {
    button.disabled = false;
  }
});
</script>
