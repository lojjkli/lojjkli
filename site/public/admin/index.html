<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<title>lojjkli — Welcome back, Kli</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #020202;
    --black: #050505;
    --card: #0d0d0d;
    --card-hover: #111111;
    --line: #202020;
    --line-bright: #343434;

    --text: #f4f4f4;
    --dim: #9a9a9a;
    --faint: #5e5e5e;

    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;

    --display: "Space Grotesk", sans-serif;
    --body: "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--void);
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(
        circle at 50% -10%,
        rgba(255,255,255,.055),
        transparent 34%
      ),
      var(--void);
    color: var(--text);
    font: 15px/1.6 var(--body);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: .25;

    background:
      linear-gradient(
        rgba(255,255,255,.018) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(255,255,255,.018) 1px,
        transparent 1px
      );

    background-size: 48px 48px;

    mask-image: linear-gradient(
      to bottom,
      black,
      transparent 80%
    );
  }

  /* =========================================================
     INTRO
     ========================================================= */

  #intro {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
      radial-gradient(
        circle at center,
        #111 0%,
        #050505 42%,
        #020202 75%
      );

    opacity: 1;
    transition:
      opacity 1s cubic-bezier(.77,0,.18,1),
      visibility 1s;
  }

  #intro::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 1px,
        transparent 4px
      );

    opacity: .3;
    pointer-events: none;
  }

  #intro::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
      radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.75) 100%
      );

    pointer-events: none;
  }

  .intro-content {
    position: relative;
    z-index: 2;

    width: min(90vw, 700px);
    text-align: center;

    animation:
      introEnter 1.6s cubic-bezier(.2,.8,.2,1) both;
  }

  .intro-overline {
    margin-bottom: 14px;

    color: #666;

    font: 500 10px var(--mono);
    letter-spacing: .38em;
    text-transform: uppercase;

    opacity: 0;

    animation:
      fadeUp .8s ease .35s forwards;
  }

  .intro-title {
    margin: 0;

    color: #f5f5f5;

    font: 700 clamp(38px, 8vw, 82px)/.95 var(--display);

    letter-spacing: -.065em;

    text-shadow:
      0 0 15px rgba(255,255,255,.1),
      0 0 60px rgba(255,255,255,.07);

    white-space: nowrap;
  }

  .intro-title span {
    display: inline-block;

    opacity: 0;
    transform: translateY(18px);

    animation:
      letterIn .7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .intro-title span:nth-child(1) { animation-delay: .45s; }
  .intro-title span:nth-child(2) { animation-delay: .49s; }
  .intro-title span:nth-child(3) { animation-delay: .53s; }
  .intro-title span:nth-child(4) { animation-delay: .57s; }
  .intro-title span:nth-child(5) { animation-delay: .61s; }
  .intro-title span:nth-child(6) { animation-delay: .65s; }
  .intro-title span:nth-child(7) { animation-delay: .69s; }
  .intro-title span:nth-child(8) { animation-delay: .73s; }
  .intro-title span:nth-child(9) { animation-delay: .77s; }
  .intro-title span:nth-child(10) { animation-delay: .81s; }
  .intro-title span:nth-child(11) { animation-delay: .85s; }
  .intro-title span:nth-child(12) { animation-delay: .89s; }
  .intro-title span:nth-child(13) { animation-delay: .93s; }
  .intro-title span:nth-child(14) { animation-delay: .97s; }
  .intro-title span:nth-child(15) { animation-delay: 1.01s; }
  .intro-title span:nth-child(16) { animation-delay: 1.05s; }

  .intro-line {
    width: 0;
    height: 1px;

    margin: 22px auto 16px;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.8),
      transparent
    );

    animation:
      lineGrow 1s ease .8s forwards;
  }

  .intro-sub {
    color: #696969;

    font: 500 10px var(--mono);

    letter-spacing: .3em;
    text-transform: uppercase;

    opacity: 0;

    animation:
      fadeUp .8s ease 1.1s forwards;
  }

  .intro-status {
    position: absolute;
    left: 50%;
    bottom: 56px;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 9px;

    color: #555;

    font: 500 10px var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;

    white-space: nowrap;

    opacity: 0;

    animation:
      fadeUp .8s ease 1.3s forwards;
  }

  .intro-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
      0 0 10px rgba(255,255,255,.55);

    animation: pulse 1.3s ease-in-out infinite;
  }

  .intro-progress {
    position: absolute;
    left: 50%;
    bottom: 32px;

    width: min(260px, 60vw);
    height: 1px;

    transform: translateX(-50%);

    background: #171717;
    overflow: hidden;
  }

  .intro-progress-bar {
    width: 0;
    height: 100%;

    background: #aaa;

    animation:
      progress 2.3s cubic-bezier(.25,.8,.25,1) forwards;
  }

  #intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* =========================================================
     MAIN
     ========================================================= */

  .wrap {
    position: relative;
    z-index: 1;

    width: min(100%, 760px);

    margin: 0 auto;

    padding:
      64px 24px 100px;
  }

  .brand {
    margin-bottom: 34px;
  }

  .brand-name {
    margin: 0;

    font:
      700 30px/1 var(--display);

    letter-spacing: -.045em;
  }

  .brand-sub {
    margin: 8px 0 0;

    color: var(--faint);

    font:
      500 10px var(--mono);

    letter-spacing: .16em;
    text-transform: uppercase;
  }

  h2 {
    margin: 0 0 14px;

    color: #b5b5b5;

    font:
      600 14px var(--display);
  }

  .card {
    position: relative;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.025),
        rgba(255,255,255,.008)
      ),
      var(--card);

    border: 1px solid var(--line);

    border-radius: 14px;

    padding: 20px;

    margin-bottom: 18px;

    box-shadow:
      0 18px 60px rgba(0,0,0,.18);

    transition:
      border-color .2s ease,
      background .2s ease,
      transform .2s ease;
  }

  .card:hover {
    border-color: #2b2b2b;
  }

  label {
    display: block;

    margin-bottom: 9px;

    color: var(--faint);

    font:
      500 10px var(--mono);

    letter-spacing: .13em;
    text-transform: uppercase;
  }

  input {
    width: 100%;

    padding: 11px 13px;

    background: #080808;

    color: var(--text);

    border: 1px solid var(--line);

    border-radius: 9px;

    outline: none;

    font:
      14px var(--mono);

    transition:
      border-color .2s ease,
      box-shadow .2s ease,
      background .2s ease;
  }

  input::placeholder {
    color: #454545;
  }

  input:focus {
    border-color: #404040;

    background: #0a0a0a;

    box-shadow:
      0 0 0 3px rgba(255,255,255,.025);
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > div {
    flex: 1;
    min-width: 0;
  }

  button {
    position: relative;

    background: #f1f1f1;

    border: 1px solid #f1f1f1;

    border-radius: 9px;

    color: #050505;

    padding: 10px 17px;

    font:
      600 12px var(--body);

    cursor: pointer;

    white-space: nowrap;

    transition:
      transform .15s ease,
      opacity .15s ease,
      background .15s ease;
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0) scale(.98);
  }

  button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
  }

  button.danger {
    color: #fff;
    background: var(--red);
    border-color: var(--red);
  }

  button.warn {
    color: #1a1204;
    background: var(--amber);
    border-color: var(--amber);
  }

  button.ghost {
    color: #a0a0a0;
    background: transparent;
    border-color: var(--line-bright);
  }

  button.ghost:hover {
    background: #171717;
    color: #ddd;
  }

  #msg {
    min-height: 18px;

    margin-top: 11px;

    font:
      500 11px var(--mono);

    color: var(--dim);
  }

  #msg.error {
    color: var(--red);
  }

  #msg.success {
    color: var(--green);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
  }

  tr {
    border-bottom: 1px solid var(--line);
  }

  tr:last-child {
    border-bottom: 0;
  }

  td {
    padding: 10px 8px;

    border-bottom: 1px solid var(--line);

    color: #ddd;

    font:
      13px var(--mono);

    vertical-align: middle;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  td.who {
    display: flex;
    align-items: center;
    gap: 9px;

    font-weight: 500;

    border-bottom: 0;
  }

  td.reason,
  td.time {
    color: var(--dim);
  }

  td.btns {
    width: 1%;

    text-align: right;

    white-space: nowrap;
  }

  td.btns button {
    margin-left: 5px;
  }

  .head {
    width: 24px;
    height: 24px;

    flex: none;

    border-radius: 6px;

    background: #080808;

    border: 1px solid var(--line);

    image-rendering: pixelated;
  }

  .dot {
    width: 7px;
    height: 7px;

    flex: none;

    margin-right: 1px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 8px rgba(34,197,94,.75);

    animation:
      onlinePulse 1.8s ease-in-out infinite;
  }

  .empty {
    color: var(--faint);
  }

  /* =========================================================
     ANIMATIONS
     ========================================================= */

  @keyframes introEnter {
    from {
      opacity: 0;
      transform: scale(.97);
      filter: blur(8px);
    }

    to {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
  }

  @keyframes letterIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes lineGrow {
    to {
      width: min(260px, 60vw);
    }
  }

  @keyframes progress {
    0% {
      width: 0;
    }

    72% {
      width: 82%;
    }

    100% {
      width: 100%;
    }
  }

  @keyframes pulse {
    0%,100% {
      opacity: .35;
      transform: scale(.8);
    }

    50% {
      opacity: 1;
      transform: scale(1.15);
    }
  }

  @keyframes onlinePulse {
    0%,100% {
      opacity: .5;
    }

    50% {
      opacity: 1;
    }
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 640px) {
    .wrap {
      padding:
        38px 15px 70px;
    }

    .row {
      flex-direction: column;
    }

    .row > div {
      width: 100%;
    }

    .row button {
      width: 100%;
    }

    .intro-title {
      white-space: normal;
      padding: 0 15px;
    }

    table,
    tbody,
    tr,
    td {
      width: 100%;
    }

    td.btns {
      text-align: right;
    }

    td.reason {
      display: none;
    }

    td.time {
      font-size: 11px;
    }

    td.btns button {
      padding: 8px 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<body>

<!-- =========================================================
     LOJJKLI INTRO
     ========================================================= -->

<div id="intro">

  <div class="intro-content">

    <div class="intro-overline">
      KlisTeam Studio
    </div>

    <h1 class="intro-title" aria-label="Welcome back, Kli">
      <span>W</span>
      <span>e</span>
      <span>l</span>
      <span>c</span>
      <span>o</span>
      <span>m</span>

<!-- =========================================================
     MAIN SITE
     ========================================================= -->

<div class="wrap">

  <div class="brand">
    <h1 class="brand-name">
      lojjkli
    </h1>

    <p class="brand-sub">
      KlisTeam Studio · Administration
    </p>
  </div>


  <!-- =======================================================
       LOGIN
       ======================================================= -->

  <div class="card" id="loginCard">

    <label for="key">

    </label>

    <div class="row">

      <div>

          id="key"

        >

      <div style="flex:0 0 auto">
        <button
          id="unlockBtn"
          onclick="unlock()"
        >

        </button>
      </div>

          <input
            id="server"

        </div>

        <span style="color:var(--faint);font-weight:400">

        <tbody></tbody>

<script>
/* ===========================================================
   CONFIG
   =========================================================== */

const API = "https://api.lojjkli.site";


/* ===========================================================
   HELPERS
   =========================================================== */

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeName(value) {
  return String(value ?? "")
    .replace(/[^A-Za-z0-9_]/g, "");
}

function setMessage(text, type = "") {
  const msg = $("msg");
  msg.textContent = text;
  msg.className = type;
}

function head(name) {
  const safe = safeName(name);

  return `
    <img
      class="head"
      alt=""
      loading="lazy"
      src="https://mc-heads.net/avatar/${safe}/24"
      onerror="
        this.onerror=null;
        this.src='https://crafatar.com/avatars/${safe}?size=24&overlay'
      "
    >
  `;
}


/* ===========================================================
   SOUND ENGINE
   =========================================================== */

let audioContext = null;

function getAudioContext() {
  if (audioContext) return audioContext;

  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioCtx) return null;

  audioContext = new AudioCtx();
  return audioContext;
}

function playStartupSound() {
  const ctx = getAudioContext();
  if (!ctx) return;

  if (ctx.state === "suspended") {
    ctx.resume().catch(() => {});
  }

  const now = ctx.currentTime;

  const bass = ctx.createOscillator();
  const bassGain = ctx.createGain();

  bass.type = "sine";

  bass.frequency.setValueAtTime(105, now);
  bass.frequency.exponentialRampToValueAtTime(42, now + .8);

  bassGain.gain.setValueAtTime(.0001, now);
  bassGain.gain.exponentialRampToValueAtTime(.25, now + .02);
  bassGain.gain.exponentialRampToValueAtTime(.0001, now + .9);

  bass.connect(bassGain);
  bassGain.connect(ctx.destination);

  bass.start(now);
  bass.stop(now + 1);

  const shimmer = ctx.createOscillator();
  const shimmerGain = ctx.createGain();

  shimmer.type = "triangle";

  shimmer.frequency.setValueAtTime(720, now + .15);
  shimmer.frequency.exponentialRampToValueAtTime(1500, now + .9);

  shimmerGain.gain.setValueAtTime(.0001, now);
  shimmerGain.gain.exponentialRampToValueAtTime(.045, now + .25);
  shimmerGain.gain.exponentialRampToValueAtTime(.0001, now + 1);

  shimmer.connect(shimmerGain);
  shimmerGain.connect(ctx.destination);

  shimmer.start(now);
  shimmer.stop(now + 1.05);
}

function playClickSound() {
  const ctx = getAudioContext();
  if (!ctx) return;

  if (ctx.state === "suspended") {
    ctx.resume().catch(() => {});
  }

  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";

  osc.frequency.setValueAtTime(620, now);
  osc.frequency.exponentialRampToValueAtTime(390, now + .07);

  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(.035, now + .008);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .08);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + .09);
}


/* ===========================================================
   INTRO
   =========================================================== */

let introFinished = false;

function finishIntro() {
  if (introFinished) return;

  introFinished = true;

  const intro = $("intro");
  if (!intro) return;

  intro.classList.add("hide");

  setTimeout(() => {
    intro.remove();
  }, 1100);
}

function activateAudio() {
  const ctx = getAudioContext();

  if (!ctx) return;

  if (ctx.state === "suspended") {
    ctx.resume().catch(() => {});
  }

  playStartupSound();
}

window.addEventListener(
  "pointerdown",
  activateAudio,
  { once: true }
);

window.addEventListener(
  "keydown",
  activateAudio,
  { once: true }
);

setTimeout(() => {
  finishIntro();
}, 2600);


/* ===========================================================
   API
   =========================================================== */

async function apiRequest(url, options = {}) {
  try {
    return await fetch(url, {
      ...options,
      headers: {
        "Accept": "application/json",
        ...(options.headers || {})
      }
    });
  } catch (error) {
    console.error("API request failed:", error);
    throw error;
  }
}


/* ===========================================================
   UNLOCK
   =========================================================== */

async function unlock() {
  playClickSound();

  const key = $("key").value.trim();
  const button = $("unlockBtn");

  if (!key) {
    setMessage("Enter the admin key.", "error");
    $("key").focus();
    return;
  }

  button.disabled = true;
  setMessage("Checking...");

  try {
    const response = await apiRequest(
      `${API}/verify`,
      {
        method: "GET",
        headers: {
          "x-admin-key": key
        }
      }
    );

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        setMessage("Wrong admin key.", "error");
      } else {
        setMessage(
          `Server returned HTTP ${response.status}.`,
          "error"
        );
      }

      button.disabled = false;
      return;
    }

    setMessage("Unlocked.", "success");

    $("loginCard").style.display = "none";
    $("panels").style.display = "block";

    await refreshBlacklist();
    await refreshOnline();

    if (!window.onlineTimer) {
      window.onlineTimer = setInterval(
        refreshOnline,
        15000
      );
    }

  } catch (error) {
    console.error(error);

    setMessage(
      "Could not connect to the API. Check the API or CORS configuration.",
      "error"
    );

    button.disabled = false;
  }
}


/* ===========================================================
   BLACKLIST
   =========================================================== */

async function refreshBlacklist() {
  try {
    const key = $("key").value.trim();

    const response = await apiRequest(
      `${API}/blacklist`,
      {
        method: "GET",
        headers: {
          "x-admin-key": key
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        `Blacklist HTTP ${response.status}`
      );
    }

    const data = await response.json();

    const details =
      Array.isArray(data.detail)
        ? data.detail
        : [];


    /* -------------------------------------------------------
       SERVERS
       ------------------------------------------------------- */

    $("serverList")
      .querySelector("tbody")
      .innerHTML = details

      .filter(x => x.kind === "server")

      .map(row => `
        <tr>
          <td>
            ${escapeHtml(row.value)}
          </td>

          <td class="reason">
            ${escapeHtml(row.reason)}
          </td>

          <td class="btns">
            <button
              class="ghost"
              data-action="remove"
              data-kind="server"
              data-value="${escapeHtml(row.value)}"
            >
              Remove
            </button>
          </td>
        </tr>
      `)

      .join("")

      || `
        <tr>
          <td class="empty">
            No servers blocked
          </td>
        </tr>
      `;


    /* -------------------------------------------------------
       PLAYERS
       ------------------------------------------------------- */

    $("playerList")
      .querySelector("tbody")
      .innerHTML = details

      .filter(x => x.kind === "player")

      .map(row => `
        <tr>
          <td class="who">
            ${head(row.display)}
            ${escapeHtml(row.display)}
          </td>

          <td class="reason">
            ${escapeHtml(row.reason)}
          </td>

          <td class="btns">

            <button
              class="warn"
              data-action="kick"
              data-name="${escapeHtml(row.display)}"
            >
              Kick
            </button>

            <button
              class="ghost"
              data-action="remove"
              data-kind="player"
              data-value="${escapeHtml(row.value)}"
            >
              Unban
            </button>

          </td>
        </tr>
      `)

      .join("")

      || `
        <tr>
          <td class="empty">
            Nobody banned
          </td>
        </tr>
      `;

  } catch (error) {
    console.error("Blacklist error:", error);

    setMessage(
      "Could not load blacklist.",
      "error"
    );
  }
}


/* ===========================================================
   ONLINE
   =========================================================== */

async function refreshOnline() {
  try {
    const response = await apiRequest(
      `${API}/online?minutes=5`
    );

    if (!response.ok) {
      throw new Error(
        `Online HTTP ${response.status}`
      );
    }

    const data = await response.json();

    const players =
      Array.isArray(data.players)
        ? data.players
        : [];

    $("onlineList")
      .querySelector("tbody")
      .innerHTML = players

      .map(player => {

        const secondsAgo =
          Math.max(
            0,
            Math.round(
              (Date.now() - player.last) / 1000
            )
          );

        return `
          <tr>

            <td class="who">

              <span class="dot"></span>

              ${head(player.name)}

              ${escapeHtml(player.name)}

            </td>

            <td class="time">
              ${secondsAgo}s ago
            </td>

            <td class="btns">

              <button
                class="warn"
                data-action="kick"
                data-name="${escapeHtml(player.name)}"
              >
                Kick
              </button>

              <button
                class="danger"
                data-action="ban"
                data-name="${escapeHtml(player.name)}"
              >
                Ban
              </button>

            </td>

          </tr>
        `;
      })

      .join("")

      || `
        <tr>
          <td class="empty">
            Nobody currently active
          </td>
        </tr>
      `;

  } catch (error) {
    console.error("Online error:", error);
  }
}


/* ===========================================================
   WRITE
   =========================================================== */

async function write(
  kind,
  value,
  reason,
  method
) {
  playClickSound();

  const key = $("key").value.trim();

  if (!key) {
    setMessage(
      "Enter the admin key first.",
      "error"
    );

    return false;
  }

  if (!value) {
    setMessage(
      "Nothing entered.",
      "error"
    );

    return false;
  }

  const params = new URLSearchParams();

  params.set("kind", kind);
  params.set("value", value);

  if (reason) {
    params.set("reason", reason);
  }

  try {
    const response = await apiRequest(
      `${API}/blacklist?${params.toString()}`,
      {
        method,
        headers: {
          "x-admin-key": key
        }
      }
    );

    if (!response.ok) {
      let errorText = "";

      try {
        errorText = await response.text();
      } catch (_) {}

      console.error(
        "Write failed:",
        response.status,
        errorText
      );

      setMessage(
        `Failed: HTTP ${response.status}`,
        "error"
      );

      return false;
    }

    setMessage(
      method === "DELETE"
        ? "Removed."
        : "Saved.",
      "success"
    );

    return true;

  } catch (error) {
    console.error(error);

    setMessage(
      "Could not reach the API.",
      "error"
    );

    return false;
  }
}


/* ===========================================================
   ADD SERVER
   =========================================================== */

async function addServer() {
  const value =
    $("server").value
      .trim()
      .toLowerCase();

  const reason =
    $("serverReason")
      .value
      .trim();

  const success = await write(
    "server",
    value,
    reason,
    "POST"
  );

  if (success) {
    $("server").value = "";
    $("serverReason").value = "";

    await refreshBlacklist();
  }
}


/* ===========================================================
   ADD PLAYER
   =========================================================== */

async function addPlayer() {
  const value =
    $("player").value.trim();

  const reason =
    $("playerReason")
      .value
      .trim();

  const success = await write(
    "player",
    value,
    reason,
    "POST"
  );

  if (success) {
    $("player").value = "";
    $("playerReason").value = "";

    await refreshBlacklist();
  }
}


/* ===========================================================
   BAN ONLINE PLAYER
   =========================================================== */

async function banFromOnline(name) {
  const success = await write(
    "player",
    name,
    "banned from online list",
    "POST"
  );

  if (success) {
    await refreshBlacklist();
    await refreshOnline();
  }
}


/* ===========================================================
   REMOVE / UNBAN
   =========================================================== */

async function removeItem(kind, value) {
  const success = await write(
    kind,
    value,
    "",
    "DELETE"
  );

  if (success) {
    await refreshBlacklist();
  }
}


/* ===========================================================
   KICK
   =========================================================== */

async function kick(name) {
  playClickSound();

  const key = $("key").value.trim();

  if (!key) {
    setMessage(
      "Enter the admin key first.",
      "error"
    );

    return;
  }

  try {
    const response = await apiRequest(
      `${API}/kick?name=${encodeURIComponent(name)}`,
      {
        method: "POST",
        headers: {
          "x-admin-key": key
        }
      }
    );

    if (response.ok) {
      setMessage(
        `Kick sent for ${name}.`,
        "success"
      );

      await refreshOnline();

    } else {
      let errorText = "";

      try {
        errorText = await response.text();
      } catch (_) {}

      console.error(
        "Kick failed:",
        response.status,
        errorText
      );

      setMessage(
        `Kick failed: HTTP ${response.status}`,
        "error"
      );
    }

  } catch (error) {
    console.error(error);

    setMessage(
      "Could not reach the API.",
      "error"
    );
  }
}


/* ===========================================================
   ENTER TO UNLOCK
   =========================================================== */

$("key").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      event.preventDefault();
      unlock();
    }
  }
);


/* ===========================================================
   BUTTON HANDLER
   =========================================================== */

/*
 * IMPORTANT:
 * No inline onclick handlers are used for dynamically generated
 * buttons anymore. This avoids broken HTML attributes caused by
 * JSON.stringify() quotes.
 */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest("button");

    if (!button) return;

    const action =
      button.dataset.action;

    if (!action) return;

    button.disabled = true;

    try {

      if (action === "remove") {

        const kind =
          button.dataset.kind;

        const value =
          button.dataset.value;

        await removeItem(
          kind,
          value
        );

      }

      else if (action === "kick") {

        const name =
          button.dataset.name;

        await kick(name);

      }

      else if (action === "ban") {

        const name =
          button.dataset.name;

        await banFromOnline(name);

      }

    } finally {

      button.disabled = false;

    }
  }
);


/* ===========================================================
   SOUND
   =========================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest("button");

    if (!button) return;

    /*
     * Action functions already play their own sound.
     * This listener intentionally does nothing.
     */
  }
);
</script>
