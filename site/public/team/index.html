<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Team · lojjkli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Design tokens lifted from the main site so /team belongs to it */
  :root{
    --void:#020202; --surface:#0A0A0A; --raised:#101010; --card:#111111;
    --line:#262626; --line-bright:#3C3C3C;
    --text:#F2F2F2; --dim:#A3A3A3; --faint:#6C6C6C; --sub:#6b6b6b;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
    --glow:0 0 34px rgba(255,255,255,.16);
    --max:1180px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--text);
       font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--max);margin:0 auto;padding:72px 28px 96px}
  h1{font:600 34px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 10px}
  .sub{color:var(--faint);margin:0 0 44px;font-size:14px;letter-spacing:.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:22px;margin-bottom:20px}
  label{display:block;color:var(--faint);font:500 11px/1 var(--mono);
        letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
  input{width:100%;background:var(--surface);border:1px solid var(--line);
        border-radius:9px;color:var(--text);padding:11px 13px;font:14px var(--mono)}
  input:focus{outline:none;border-color:var(--line-bright)}
  .row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .row>div{flex:1;min-width:210px}
  button{background:var(--text);border:0;border-radius:9px;color:var(--void);
         padding:12px 26px;font:600 14px var(--body);cursor:pointer;
         transition:box-shadow .2s ease,transform .1s ease;white-space:nowrap}
  button:hover{box-shadow:var(--glow)}
  button:active{transform:translateY(1px)}
  button.off{background:transparent;color:var(--dim);border:1px solid var(--line-bright)}
  #status{display:flex;align-items:center;gap:10px;font:13px var(--mono);color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .dot.err{background:var(--red)}
  .dot.warn{background:var(--amber)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--faint);font:500 11px/1 var(--mono);
     letter-spacing:.12em;text-transform:uppercase;
     padding:0 12px 12px 0;border-bottom:1px solid var(--line)}
  td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);font:14px var(--mono)}
  tr:last-child td{border-bottom:0}
  .name{color:var(--text);font-weight:500}
  .who{display:flex;align-items:center;gap:10px}
  .head{width:26px;height:26px;border-radius:5px;image-rendering:pixelated;
        background:var(--surface);border:1px solid var(--line);flex:none}
  .coords{color:#d8d8d8}
  .muted{color:var(--sub)}
  .stale{opacity:.35}
  .empty{color:var(--faint);text-align:center;padding:34px 0;font-size:13px}
  .credit{color:var(--faint);font-size:13px;margin-top:40px;padding-top:24px;
          border-top:1px solid var(--line);text-align:center;letter-spacing:.01em}
  .credit a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line-bright);
            padding-bottom:1px;transition:color .2s ease}
  .credit a:hover{color:var(--text)}
  .credit .heart{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Team tracker</h1>
  <p class="sub">Live positions from your relay room. Decrypted here in your browser.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="room">Room name</label>
        <input id="room" type="text" placeholder="our-team" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="key">Password</label>
        <input id="key" type="password" placeholder="room password" autocomplete="off" spellcheck="false">
      </div>
      <div style="flex:0 0 auto;min-width:0">
        <button id="go">Connect</button>
      </div>
    </div>
    <div style="margin-top:14px" id="status"><span class="dot" id="dot"></span><span id="msg">Not connected</span></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th style="width:22%">Player</th><th style="width:26%">Position</th>
            <th style="width:16%">Dimension</th><th style="width:24%">Server</th><th style="width:12%">Seen</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No positions yet.</div>
  </div>
  <p class="credit">
    made with <span class="heart">&#9829;</span> by <a href="/">lojjkli</a>
  </p>
</div>

<script>
const RELAY = 'wss://relay.lojjkli.site';
const STALE_MS = 15000, DROP_MS = 120000;
const PROTOCOL_VERSION = 1;           // must match RelayShare.PROTOCOL_VERSION

const enc = new TextEncoder();
const dec = new TextDecoder();
const $ = id => document.getElementById(id);
const hex = b => [...b].map(x => x.toString(16).padStart(2,'0')).join('');
const sha256 = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)));

let ws = null, aesKey = null, players = new Map();
let goodFrames = 0, badFrames = 0, decryptWarned = false;
// "The user wants to be connected" - separate from whether a socket happens to be
// open right now, so a dropped connection can retry without fighting a manual
// disconnect. The page used to just print "Disconnected" and sit there dead.
let intended = false, retries = 0, retryTimer = null;

function setStatus(text, state) {
  $('msg').textContent = text;
  $('dot').className = 'dot' + (state ? ' ' + state : '');
}

// Must match RelayShare.java exactly, or nothing decrypts.
async function derive(key) {
  const roomId = hex(await sha256('klisteam-room|' + key)).slice(0, 32);
  const salt = await sha256('klisteam-crypt|' + key);
  const base = await crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
  const aes  = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:120000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  return { roomId, aes };
}

const DIMS = {
  'minecraft:overworld':  'Overworld',
  'minecraft:the_nether': 'Nether',
  'minecraft:the_end':    'The End'
};

async function handle(raw) {
  if (raw === 'pong') return;
  let env;
  try { env = JSON.parse(raw); } catch { return; }
  if (!env || !env.p) return;
  if (env.v !== undefined && env.v !== PROTOCOL_VERSION) return;   // mod does the same check
  try {
    const bytes = Uint8Array.from(atob(env.p), c => c.charCodeAt(0));
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: bytes.slice(0,12) }, aesKey, bytes.slice(12));
    const o = JSON.parse(dec.decode(pt));
    if (!o.n) return;

    goodFrames++;
    // Ping-wheel markers ride the same socket and carry the *marker's* x/y/z, not
    // the sender's. Storing them as a position was teleporting a player's row to
    // wherever they last pinged, which is most of what looked broken here.
    if (o.k === 'ping') return;

    players.set(o.n.toLowerCase(), Object.assign({}, o, { at: Date.now() }));
    if (!decryptWarned) setStatus('Connected · ' + goodFrames + ' updates', 'on');
  } catch {
    // GCM refused it: almost always a different team key in the room
    badFrames++;
    if (badFrames >= 5 && !decryptWarned) {
      decryptWarned = true;   // latched, so the next good frame can't wipe the warning
      setStatus('Receiving frames but cannot decrypt - wrong room password?', 'err');
    }
  }
}

function openSocket(roomId) {
  const sock = new WebSocket(RELAY + '/' + roomId);
  ws = sock;
  let pingTimer = null;

  sock.onopen = () => {
    retries = 0;
    setStatus('Connected \u00b7 waiting for positions', 'on');
    $('go').textContent = 'Disconnect';
    $('go').classList.add('off');
    // keeps the connection past Cloudflare's idle timeout. Captured in this
    // closure rather than hung off the shared `ws`, so an old socket closing
    // late can't clear the current socket's timer.
    pingTimer = setInterval(() => { try { sock.send('ping'); } catch {} }, 30000);
  };

  sock.onmessage = e => handle(e.data);

  sock.onerror = () => { /* onclose always follows; handled there */ };

  sock.onclose = () => {
    clearInterval(pingTimer);
    if (ws === sock) ws = null;
    if (!intended) {
      $('go').textContent = 'Connect';
      $('go').classList.remove('off');
      setStatus('Disconnected');
      return;
    }
    // Wanted to stay connected: back off and retry rather than going dead.
    retries++;
    const wait = Math.min(30000, 1000 * Math.pow(2, Math.min(retries, 5)));
    setStatus('Connection lost - retrying in ' + Math.round(wait / 1000) + 's\u2026', 'warn');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (intended) openSocket(roomId); }, wait);
  };
}

function disconnect() {
  intended = false;
  clearTimeout(retryTimer);
  retries = 0;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  $('go').textContent = 'Connect';
  $('go').classList.remove('off');
  setStatus('Not connected');
}

function connect() {
  // Checked before the room field is validated: with the old order, clearing the
  // room box left you unable to press Disconnect.
  if (intended) { disconnect(); return; }

  const room = $('room').value.trim();
  const pass = $('key').value.trim();
  if (!room) { setStatus('Enter the room name', 'err'); return; }
  // must match RelayShare.secret() in the mod, character for character
  const key = room.toLowerCase() + '|' + pass;

  setStatus('Deriving key\u2026');
  derive(key).then(({ roomId, aes }) => {
    aesKey = aes;
    goodFrames = badFrames = 0;
    decryptWarned = false;
    players.clear();
    intended = true;
    retries = 0;
    setStatus('Connecting to room ' + roomId.slice(0,8) + '\u2026');
    openSocket(roomId);
  }).catch(e => setStatus('Could not derive key: ' + e.message, 'err'));
}

// Declared once, at module scope: these used to be consts inside the map callback
// that the "sharing off" branch referenced *above* their own declaration, which
// threw a ReferenceError, killed the whole draw(), and froze the table for good
// the moment any teammate turned sharing off.
const clean = v => String(v == null ? '' : v).replace(/[<>&"']/g, '');
const td = (cls, v) => '<td class="' + cls + '">' + clean(v) + '</td>';
const safeName = n => String(n == null ? '' : n).replace(/[^A-Za-z0-9_]/g, '');
const num = v => (v != null && Number.isFinite(Number(v))) ? Math.round(Number(v)) : '?';

function headImg(name) {
  // mc-heads renders by username; crafatar is the fallback if it misses
  return '<img class="head" alt="" loading="lazy"'
    + ' src="https://mc-heads.net/avatar/' + name + '/52"'
    + ' onerror="this.onerror=null;this.src=\'https://crafatar.com/avatars/' + name
    + '?size=52&overlay\'">';
}

function rowHtml(p, now) {
  const age = Math.round((now - p.at) / 1000);
  const stale = now - p.at > STALE_MS;
  const name = safeName(p.n);
  const seen = age < 2 ? 'now' : age + 's ago';
  const who = '<td class="name"><span class="who">' + headImg(name)
            + '<span>' + clean(p.n) + '</span></span></td>';

  // Present in the room but not publishing coordinates.
  if (p.off) {
    return '<tr class="' + (stale ? 'stale' : '') + '">'
      + who
      + '<td class="muted" colspan="2">sharing turned off</td>'
      + td('muted', p.sa || '-')
      + td('muted', seen)
      + '</tr>';
  }

  const dim = DIMS[p.d] || String(p.d || '-').replace(/^.*:/, '');
  return '<tr class="' + (stale ? 'stale' : '') + '">'
    + who
    + td('coords', num(p.x) + ', ' + num(p.y) + ', ' + num(p.z))
    + td('muted', dim)
    + td('muted', p.sa || '-')
    + td('muted', seen)
    + '</tr>';
}

function draw() {
  const now = Date.now();
  for (const [k, p] of players) if (now - p.at > DROP_MS) players.delete(k);

  const list = [...players.values()].sort((a,b) => String(a.n).localeCompare(String(b.n)));
  $('empty').style.display = list.length ? 'none' : 'block';
  try {
    $('rows').innerHTML = list.map(p => rowHtml(p, now)).join('');
  } catch (e) {
    // One malformed frame should never be able to stop the table updating again.
    console.error('draw failed', e);
  }
}

setInterval(draw, 1000);
$('go').onclick = connect;
$('room').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
