# Public assets plus an Discord-authenticated TAGGY API proxy.

name = "lojjkli-site"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[vars]
TAGGY_BACKEND_URL = "https://1u061e9dv7.apps.bot-hosting.cloud"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/taggy/api/*", "/taggy/auth/*"]
# Serve public/404.html on unknown paths; drop this line to get a plain 404.
not_found_handling = "404-page"

[[routes]]
pattern = "lojjkli.site"
custom_domain = true

[[routes]]
pattern = "www.lojjkli.site"
custom_domain = true
